{%- assign sponsor_github = site.sponsor.github | default: '' | strip -%}
{%- if page.seo.type == 'BlogPosting' and sponsor_github != '' -%}
<aside class="article-sponsor" aria-label="후원">
  <p>이 글이 도움이 됐다면 커피 한 잔으로 응원해 주세요.</p>
  <a class="article-sponsor__btn" href="https://github.com/sponsors/{{ sponsor_github | uri_escape }}" target="_blank" rel="noopener">♥ Sponsor</a>
</aside>
{%- endif -%}
