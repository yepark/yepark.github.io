title: 옙개발
description: 옙개발. 나를 위한 개발 기록 (AI, Swift, iOS, 보안)
url: "https://yepark.github.io"
baseurl: ""
lang: ko-KR
locale: ko_KR
timezone: Asia/Seoul
author:
  name: yep
  url: "https://yepark.github.io/about/"
social:
  name: 옙개발
  links:
    - "https://github.com/yepark"

adsense:
  client: "ca-pub-2792981526199831"
  # 승인 후 AdSense에서 생성한 반응형 디스플레이 광고 단위 ID를 넣는다.
  post_end_slot: ""

# 후원 버튼. 값이 비어 있으면 그 버튼을 출력하지 않는다.
# github: GitHub Sponsors 프로필이 공개된 뒤 사용자 이름
# toss: toss.me/ 뒤에 붙는 토스 아이디
sponsor:
  github: ""
  toss: ""

defaults:
  - scope:
      path: "ai"
    values:
      layout: article
  - scope:
      path: "swift"
    values:
      layout: article
  - scope:
      path: "ios"
    values:
      layout: article
  - scope:
      path: "swiftui"
    values:
      layout: article
  - scope:
      path: "pki"
    values:
      layout: article
  - scope:
      path: "spring"
    values:
      layout: article

remote_theme: just-the-docs/just-the-docs@v0.10.1

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache
  - jekyll-redirect-from

# 검색
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# 화면
color_scheme: notes
heading_anchors: true
back_to_top: true
back_to_top_text: "맨 위로"
nav_sort: case_insensitive

aux_links:
  "GitHub":
    - "https://github.com/yepark"
aux_links_new_tab: true

last_edit_timestamp: true
last_edit_time_format: "%Y-%m-%d"

footer_content: "<a href=\"/about/\">yep · 옙개발</a> · 개발 기록 · <a href=\"/privacy/\">개인정보처리방침</a>"

# 글 안에서 쓰는 강조 상자
callouts_level: quiet
callouts:
  note:
    title: 참고
    color: blue
  tip:
    title: 보충 설명
    color: green
  warning:
    title: 주의
    color: red
  question:
    title: 검토할 질문
    color: purple

# 그림 대신 쓰는 다이어그램
mermaid:
  version: "10.9.1"

markdown: kramdown
kramdown:
  input: GFM
  toc_levels: "2"
  syntax_highlighter_opts:
    block:
      line_numbers: false

compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
  profile: false

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CLAUDE.md
  - vendor
  - .bundle
  - .jekyll-cache
