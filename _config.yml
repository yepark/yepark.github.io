title: 옙개발
description: 옙개발. iOS 개발자 yep의 공부 노트 (AI, Swift, iOS, PKI·암호)
url: "https://yepark.github.io"
baseurl: ""
lang: ko-KR
timezone: Asia/Seoul

remote_theme: just-the-docs/just-the-docs@v0.10.1

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache
  - jekyll-redirect-from

# 검색
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# 화면
color_scheme: notes
heading_anchors: true
back_to_top: true
back_to_top_text: "맨 위로"
nav_sort: case_insensitive

aux_links:
  "GitHub":
    - "https://github.com/yepark"
aux_links_new_tab: true

last_edit_timestamp: true
last_edit_time_format: "%Y-%m-%d"

footer_content: "옙개발 · 나중의 나를 위한 노트"

# 글 안에서 쓰는 강조 상자
callouts_level: quiet
callouts:
  note:
    title: 정리
    color: blue
  tip:
    title: 쉽게 말하면
    color: green
  warning:
    title: 주의
    color: red
  question:
    title: 잠깐, 생각해 보기
    color: purple

# 그림 대신 쓰는 다이어그램
mermaid:
  version: "10.9.1"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    block:
      line_numbers: false

compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
  profile: false

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CLAUDE.md
  - vendor
  - .bundle
  - .jekyll-cache
